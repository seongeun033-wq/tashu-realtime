name: Update Tashu Realtime Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Fetch Tashu API and save JSON
        run: python fetch_tashu.py
        env:
          TASHU_API_KEY: ${{ secrets.TASHU_API_KEY }}

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seogu_realtime.json
          git diff --staged --quiet || git commit -m "Update realtime data"
          git push origin main
